baseURL: "https://martinpeck.com/"
title: martinpeck.com
languageCode: en-gb

module:
  imports:
    - path: github.com/hugo-sid/hugo-blog-awesome

enableRobotsTXT: true
enableEmoji: true

author:
  name: Martin Peck
  email: martinjohnpeck@gmail.com

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

services:
  googleAnalytics:
    id: G-W3GQ5SV4ZZ

params:
  sitename: martinpeck.com
  description: "A blog, written by someone called Martin Peck"
  defaultColor: auto
  mainSections:
    - posts
  toc: true
  tocOpen: false
  goToTop: true
  dateFormat: "2 January 2006"
  rssFeedDescription: summary

  author:
    intro: martinpeck.com
    name: Martin Peck
    description: "A blog, written by someone called Martin Peck"

menu:
  main:
    - pageRef: /
      name: Home
      url: /
      weight: 10
    - pageRef: posts
      name: Posts
      url: /posts/
      weight: 20
    - pageRef: about
      name: About
      url: /about/
      weight: 30
    - pageRef: cartoons
      name: Cartoons
      url: /cartoons/
      weight: 40

permalinks:
  posts: /posts/:slug/
