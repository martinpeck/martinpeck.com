baseURL: "https://martinpeck.com/"
title: martinpeck.com
languageCode: en-gb
theme: LoveIt

enableRobotsTXT: true
enableEmoji: true

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
  goldmark:
    renderer:
      unsafe: true

params:
  description: "A blog, written by someone called Martin Peck"
  defaultTheme: auto
  dateFormat: "2 January 2006"

  home:
    profile:
      enable: true
      title: martinpeck.com
      subtitle: "A blog, written by someone called Martin Peck"
      avatarURL: /images/aboutme/products.png
      social: true
    posts:
      enable: true
      paginate: 9

  social:
    GitHub: martinpeck
    LinkedIn: martinpeck
    Mastodon: "@martinpeck@fosstodon.org"

  page:
    toc:
      enable: true
      keepStatic: false
      auto: true
    share:
      enable: true

  analytics:
    enable: true
    google:
      id: G-W3GQ5SV4ZZ

  section:
    paginate: 20

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: About
      url: /about/
      weight: 2
    - name: Cartoons
      url: /cartoons/
      weight: 3

permalinks:
  posts: /posts/:slug/

outputs:
  home:
    - HTML
    - RSS
    - JSON
