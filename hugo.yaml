baseURL: "https://martinpeck.com/"
title: martinpeck.com
languageCode: en-gb

module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

params:
  description: "A blog, written by someone called Martin Peck"
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayPoweredBy: false
  blog:
    list:
      displayTags: true

services:
  googleAnalytics:
    ID: G-W3GQ5SV4ZZ

menu:
  main:
    - name: Blog
      pageRef: /blog
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Cartoons
      pageRef: /cartoons
      weight: 3
    - name: GitHub
      url: https://github.com/martinpeck
      weight: 4
      params:
        icon: github
    - name: LinkedIn
      url: https://www.linkedin.com/in/martinpeck/
      weight: 5
      params:
        icon: linkedin
    - name: Mastodon
      url: https://fosstodon.org/@martinpeck
      weight: 6
      params:
        icon: mastodon

permalinks:
  blog: /blog/:slug/
